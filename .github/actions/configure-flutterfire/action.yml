name: Configure FlutterFire

description: Configure FlutterFire for the specified platforms.

inputs:
  platforms:
    description: Platforms to configure (e.g., android, web)
    required: true
  firebase-project-id:
    description: Firebase project ID
    required: true
  shell-type:
    description: The shell type to use
    required: true

runs:
  using: "composite"
  steps:
    # Requires the configure-firebase action to have run first: it exports
    # GOOGLE_APPLICATION_CREDENTIALS pointing at the service account key.
    - name: Configure FlutterFire
      run: |
        flutterfire configure \
        --service-account="$GOOGLE_APPLICATION_CREDENTIALS" \
        --project=${{ inputs.firebase-project-id }} \
        --platforms=${{ inputs.platforms }} \
        --yes
      shell: ${{ inputs.shell-type }}
